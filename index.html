<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>JMC Arquitectura · Masterplan Apartaestudios Galerías (Calle 56 # 17-53)</title>
    <meta name="title" content="JMC Arquitectura · Masterplan Apartaestudios Galerías" />
    <meta name="description" content="Masterplan 3D interactivo del Ejercicio Profesional 2 (estudio de mercado): 11 apartaestudios en la Calle 56 # 17-53, Galerías, Teusaquillo, con el contexto real de Catastro Bogotá." />
    <link rel="icon" href="./assets/branding/jmc-logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS para 'Dónde estamos' (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="./src/styles/masterplan.css" />

    <!-- Import Map para ES Modules (Three.js) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  </head>
  <body>
    <div id="app">
      <!-- Lienzo WebGL 3D -->
      <div id="canvas-container"></div>

      <!-- Controles superiores derechos -->
      <div class="top-right-bar">
        <div class="mode-switch-group">
          <button class="mode-pill-btn active" data-mode="exterior" title="Edificio del proyecto sobre el lote 02">
            <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M11 21v-3h2v3"/></svg> Exterior 3D
          </button>
          <button class="mode-pill-btn" data-mode="contexto" title="Área de estudio · Calles 53–60 / Carreras 14–24">
            <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg> Contexto urbano
          </button>
          <button class="mode-pill-btn" data-mode="top" title="Planta 3D ortogonal">
            <svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V3l18 18z"/><path d="M7 17v-4l4 4z"/></svg> Planta 3D
          </button>
        </div>
        <button class="contact-pill-btn" id="btn-laminas" title="Las 37 láminas del Canva del ejercicio">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
          Láminas
        </button>
      </div>

      <!-- Panel lateral izquierdo -->
      <div class="left-sidebar-wrapper" id="left-sidebar-wrapper"></div>

      <!-- Tarjeta flotante de la unidad -->
      <div id="room-detail-container"></div>

      <!-- Hora del día: sol real de Bogotá -->
      <div class="sky-time-control" title="Hora del día · posición real del sol en Bogotá (finales de octubre)">
        <span class="sky-time-icon"><svg class="ui-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <input type="range" id="sky-hour" min="5.8" max="18.2" step="0.05" value="10.5" />
        <span class="sky-time-label" id="sky-hour-label">10:30</span>
      </div>

      <!-- Dock inferior -->
      <div id="bottom-dock-container"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
